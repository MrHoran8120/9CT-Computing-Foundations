<script>
  (function () {
    var state = { student: null, course: [], progress: {}, lesson: 0, section: 0, saving: {}, answers: {} };
    var app = document.getElementById('app');

    /* Builds an element. Text always goes in as text, never as HTML. */
    function el(tag, attrs, children) {
      var node = document.createElement(tag);
      Object.keys(attrs || {}).forEach(function (key) {
        if (key === 'text') node.textContent = attrs[key];
        else if (key === 'onclick') node.addEventListener('click', attrs[key]);
        else if (key === 'onchange') node.addEventListener('change', attrs[key]);
        else if (key === 'onsubmit') node.addEventListener('submit', attrs[key]);
        else if (key === 'class') node.className = attrs[key];
        else if (key === 'checked' || key === 'disabled') node[key] = attrs[key];
        else node.setAttribute(key, attrs[key]);
      });
      (children || []).forEach(function (child) { if (child) node.appendChild(child); });
      return node;
    }

    function call(name, args, onDone, onFail) {
      google.script.run
        .withSuccessHandler(onDone)
        .withFailureHandler(onFail)[name].apply(null, args);
    }

    function showMessage(title, lines) {
      app.replaceChildren(el('div', { class: 'message' }, [el('h1', { text: title })].concat(
        lines.map(function (line) { return el('p', { text: line }); })
      )));
    }

    function start() {
      call('getBootstrap', [], function (data) {
        if (data.status === 'no_identity') {
          showMessage('We can\'t tell who you are', [
            'Make sure you\'re signed in with your school Google account.',
            'If you\'re signed in to more than one Google account, sign out of the others and reload this page.'
          ]);
        } else if (data.status === 'needs_registration') {
          renderRegistration();
        } else if (data.status === 'blocked') {
          showMessage('You can\'t use this course', [
            'Your account has been removed from this course.',
            'If you think this is a mistake, talk to your teacher.'
          ]);
        } else {
          state.student = data.student;
          state.course = data.course;
          state.progress = data.progress;
          state.student.os ? renderCourse() : renderOsChoice();
        }
      }, function (error) {
        var lines = ['Reload the page. If that doesn\'t work, tell your teacher.'];
        if (error && error.message) lines.push('Details for your teacher: ' + error.message);
        showMessage('The course didn\'t load', lines);
      });
    }

    function renderRegistration() {
      var note = el('p', { class: 'status', role: 'status' });
      var name = el('input', { id: 'join-name', type: 'text', autocomplete: 'name', maxlength: '60', required: 'required' });
      var code = el('input', {
        id: 'join-code', type: 'text', autocomplete: 'off', autocapitalize: 'none', spellcheck: 'false',
        required: 'required', 'aria-describedby': 'code-hint'
      });
      var submit = el('button', { type: 'submit', class: 'btn', text: 'Join the course' });

      function problem(text) {
        note.className = 'status bad';
        note.textContent = text;
        submit.disabled = false;
      }

      function join(event) {
        event.preventDefault();
        submit.disabled = true;
        note.className = 'status busy';
        note.textContent = 'Joining…';
        call('registerStudent', [name.value, code.value], function (result) {
          if (result.status === 'wrong_code') problem('That class code didn\'t work. Check it with your teacher and try again.');
          else if (result.status === 'invalid_name') problem('Please enter your name using letters only.');
          else start();
        }, function () {
          problem('That didn\'t work. Please try again. If it keeps happening, tell your teacher.');
        });
      }

      app.replaceChildren(el('div', { class: 'home L1' }, [
        el('h1', { text: 'Join Computing Foundations' }),
        el('p', { text: 'You only need to do this once. After that, the course will recognise your school Google account.' }),
        el('form', { class: 'join', onsubmit: join }, [
          el('div', { class: 'field' }, [
            el('label', { for: 'join-name', text: 'Your first and last name' }),
            name
          ]),
          el('div', { class: 'field' }, [
            el('label', { for: 'join-code', text: 'Class code' }),
            el('span', { class: 'hint', id: 'code-hint', text: 'Your teacher will give you this.' }),
            code
          ]),
          el('div', {}, [submit]),
          note
        ])
      ]));
    }

    function renderOsChoice() {
      var note = el('p', { class: 'status', role: 'status' });
      function choose(os) {
        return function () {
          note.className = 'status busy';
          note.textContent = 'Saving…';
          call('setOs', [os], function () {
            state.student.os = os;
            renderCourse();
          }, function () {
            note.className = 'status bad';
            note.textContent = 'That didn\'t save. Please try again.';
          });
        };
      }
      app.replaceChildren(el('div', { class: 'home' }, [
        el('h1', { text: 'Welcome, ' + state.student.name }),
        el('p', { text: 'What computer are you using? You get steps that match it, and you can change this at any time.' }),
        el('div', { class: 'os-choice' }, [
          el('button', { type: 'button', text: 'Windows laptop', onclick: choose('win') }),
          el('button', { type: 'button', text: 'MacBook', onclick: choose('mac') })
        ]),
        note
      ]));
    }

    function lessonTasks(lesson) {
      var tasks = [];
      lesson.sections.forEach(function (section) {
        if (!section.extension) tasks = tasks.concat(section.tasks);
      });
      return tasks;
    }

    function isSectionDone(section) {
      return section.tasks.every(function (task) { return state.progress[task.id]; });
    }

    /* Lesson text can differ by computer: { win: '...', mac: '...' }. */
    function forOs(value) {
      if (value && typeof value === 'object' && !Array.isArray(value)) return value[state.student.os] || '';
      return value;
    }

    /* Turns **bold**, `code` and [[key]] into elements. Text always goes in as text. */
    function richText(tag, attrs, value) {
      var node = el(tag, attrs);
      var text = forOs(value);
      var pattern = /\*\*(.+?)\*\*|`(.+?)`|\[\[(.+?)\]\]/g;
      var last = 0;
      var match;
      while ((match = pattern.exec(text))) {
        node.appendChild(document.createTextNode(text.slice(last, match.index)));
        if (match[1]) node.appendChild(el('strong', { text: match[1] }));
        if (match[2]) node.appendChild(el('code', { text: match[2] }));
        if (match[3]) node.appendChild(el('kbd', { text: match[3] }));
        last = pattern.lastIndex;
      }
      node.appendChild(document.createTextNode(text.slice(last)));
      return node;
    }

    function renderContent(section) {
      if (!section.content) {
        return el('p', { class: 'placeholder', text: 'The lesson content for this section is still being written.' });
      }
      return el('div', { class: 'content' }, section.content.map(renderBlock));
    }

    function renderBlock(block) {
      if (block.only && block.only !== state.student.os) return null;
      if (block.type === 'objective') return richText('p', { class: 'objective' }, block.text);
      if (block.type === 'concept') return richText('p', { class: 'concept' }, block.text);
      if (block.type === 'tip') return richText('p', { class: 'tip' }, block.text);
      if (block.type === 'diagram') return renderDiagram(block);
      if (block.type === 'steps') return renderSteps(block);
      if (block.type === 'keys') return renderKeys(block);
      if (block.type === 'download') return renderDownload(block);
      if (block.type === 'choice') return renderChoice(block);
      if (block.type === 'match') return renderMatch(block);
      if (block.type === 'tree') return renderTree(block);
      return null;
    }

    /* Diagrams are fixed drawings from Diagrams.gs. They contain no student or browser input. */
    function renderDiagram(block) {
      var drawing = el('div', { class: 'diagram', role: 'img', 'aria-label': forOs(block.alt) });
      drawing.innerHTML = forOs(block.svg);
      return el('figure', { class: 'figure' }, [
        drawing,
        block.caption ? richText('figcaption', {}, block.caption) : null
      ]);
    }

    function renderSteps(block) {
      return el('div', { class: 'block' }, [
        el('h3', { text: block.title }),
        block.intro ? richText('p', {}, block.intro) : null,
        el('ol', { class: 'steps' }, block.steps.map(function (step) { return richText('li', {}, step); }))
      ]);
    }

    function renderKeys(block) {
      return el('div', { class: 'block' }, [
        el('h3', { text: block.title }),
        el('table', { class: 'keys' }, [el('tbody', {}, block.rows.map(function (row) {
          return el('tr', {}, [el('th', { scope: 'row', text: row[0] }), richText('td', {}, row[1])]);
        }))])
      ]);
    }

    /* Builds the file in the browser, so lessons need no hosting apart from this app. */
    function renderDownload(block) {
      var note = el('span', { class: 'status', role: 'status' });
      var button = el('button', { type: 'button', class: 'btn', text: block.label });
      button.addEventListener('click', function () {
        button.disabled = true;
        note.className = 'status busy';
        note.textContent = 'Getting your file…';
        call('getExerciseFile', [block.file], function (file) {
          var bytes = Uint8Array.from(atob(file.data), function (c) { return c.charCodeAt(0); });
          var url = URL.createObjectURL(new Blob([bytes], { type: file.mime }));
          var link = el('a', { href: url, download: file.name, target: '_self' });
          document.body.appendChild(link);
          link.click();
          link.remove();
          setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
          button.disabled = false;
          note.className = 'status ok';
          note.textContent = 'Check your Downloads folder.';
        }, function () {
          button.disabled = false;
          note.className = 'status bad';
          note.textContent = 'That didn\'t download. Please try again, or tell your teacher.';
        });
      });
      return el('div', { class: 'download' }, [button, note]);
    }

    function renderChoice(block) {
      var key = 'choice-' + block.id;
      var feedback = el('p', { class: 'feedback', role: 'status' });
      var buttons = [];
      function show(index) {
        buttons.forEach(function (button, i) {
          button.className = 'option' + (i === index ? (i === block.answer ? ' right' : ' wrong') : '');
          button.setAttribute('aria-pressed', i === index ? 'true' : 'false');
        });
        var right = index === block.answer;
        feedback.className = 'feedback ' + (right ? 'ok' : 'bad');
        var message = right ? 'Correct. ' + forOs(block.explain) : 'Not quite. Have another go.';
        feedback.replaceChildren.apply(feedback, Array.from(richText('span', {}, message).childNodes));
      }
      block.options.forEach(function (option, i) {
        buttons.push(richText('button', {
          type: 'button', class: 'option', 'aria-pressed': 'false',
          onclick: function () { state.answers[key] = i; show(i); }
        }, option));
      });
      if (state.answers[key] !== undefined) show(state.answers[key]);
      return el('div', { class: 'block activity' }, [
        richText('p', { class: 'question' }, block.question),
        el('div', { class: 'options' }, buttons),
        feedback
      ]);
    }

    function renderMatch(block) {
      var key = 'match-' + block.id;
      var chosen = state.answers[key] || (state.answers[key] = {});
      var feedback = el('p', { class: 'feedback', role: 'status' });
      var rows = [];

      function check() {
        var right = 0;
        rows.forEach(function (row, i) {
          var ok = row.select.value === block.items[i].answer;
          if (ok) right += 1;
          row.mark.textContent = row.select.value ? (ok ? '✓' : '✗') : '';
          row.mark.className = 'mark ' + (ok ? 'ok' : 'bad');
          row.mark.setAttribute('aria-label', row.select.value ? (ok ? 'Correct' : 'Try again') : '');
        });
        var all = right === rows.length;
        feedback.className = 'feedback ' + (all ? 'ok' : 'bad');
        feedback.textContent = all ? 'All correct. Well done.' : right + ' of ' + rows.length + ' correct. Change the ones marked ✗ and check again.';
      }

      var list = el('div', { class: 'match' }, block.items.map(function (item, i) {
        var id = key + '-' + i;
        var select = el('select', { id: id, onchange: function (event) { chosen[i] = event.target.value; } },
          [el('option', { value: '', text: 'Choose…' })].concat(block.choices.map(function (choice) {
            return el('option', { value: choice, text: choice });
          })));
        select.value = chosen[i] || '';
        var mark = el('span', { class: 'mark' });
        rows.push({ select: select, mark: mark });
        return el('div', { class: 'match-row' }, [richText('label', { for: id }, item.text), select, mark]);
      }));

      return el('div', { class: 'block activity' }, [
        richText('p', { class: 'question' }, block.prompt),
        list,
        el('div', {}, [el('button', { type: 'button', class: 'btn secondary', text: 'Check my answers', onclick: check })]),
        feedback
      ]);
    }

    function renderTree(block) {
      var key = 'tree-selected';
      var output = el('code', { class: 'path-out' });
      var buttons = [];
      function select(fullPath) {
        state.answers[key] = fullPath;
        var divider = forOs(block.divider);
        output.textContent = forOs(block.start) + fullPath.split('/').join(divider);
        buttons.forEach(function (item) {
          item.button.className = item.path === fullPath ? 'selected' : '';
        });
      }
      function branch(nodes, parent) {
        return el('ul', { class: 'tree' }, nodes.map(function (node) {
          var fullPath = parent ? parent + '/' + node.name : node.name;
          var button = el('button', {
            type: 'button', text: (node.children ? '📁 ' : '📄 ') + node.name,
            onclick: function () { select(fullPath); }
          });
          buttons.push({ button: button, path: fullPath });
          return el('li', {}, [button, node.children ? branch(node.children, fullPath) : null]);
        }));
      }
      var tree = branch(block.nodes, '');
      select(state.answers[key] || block.selected);
      return el('div', { class: 'block activity' }, [
        richText('p', { class: 'question' }, block.prompt),
        tree,
        el('div', { class: 'path-box', 'aria-live': 'polite' }, [el('span', { text: 'Path: ' }), output])
      ]);
    }

    function renderCourse() {
      var lesson = state.course[state.lesson];
      var section = lesson.sections[state.section];
      var tasks = lessonTasks(lesson);
      var doneCount = tasks.filter(function (task) { return state.progress[task.id]; }).length;
      var status = el('p', { class: 'status', role: 'status' });

      var osSwitch = el('div', { class: 'os-switch', role: 'group', 'aria-label': 'Choose your computer' },
        [['win', 'Windows'], ['mac', 'Mac']].map(function (pair) {
          return el('button', {
            type: 'button', text: pair[1],
            'aria-pressed': state.student.os === pair[0] ? 'true' : 'false',
            onclick: function () { changeOs(pair[0], status); }
          });
        }));

      var lessonTabs = el('nav', { class: 'lesson-tabs', 'aria-label': 'Lessons' },
        state.course.map(function (item, i) {
          var attrs = {
            type: 'button', class: 'lesson-tab ' + item.id, text: (i + 1) + '. ' + item.tab,
            onclick: function () { state.lesson = i; state.section = 0; renderCourse(); }
          };
          if (i === state.lesson) attrs['aria-current'] = 'page';
          return el('button', attrs);
        }));

      var sectionList = el('ol', { class: 'section-list' }, lesson.sections.map(function (item, i) {
        var attrs = {
          type: 'button', text: item.title, class: isSectionDone(item) ? 'done' : '',
          onclick: function () { state.section = i; renderCourse(); }
        };
        if (i === state.section) attrs['aria-current'] = 'step';
        return el('li', {}, [el('button', attrs)]);
      }));

      var taskList = el('div', { class: 'tasks' }, section.tasks.map(function (task) {
        return el('label', { class: 'task' }, [
          el('input', {
            type: 'checkbox', id: task.id,
            checked: !!state.progress[task.id],
            disabled: !!state.saving[task.id],
            onchange: function (event) { saveTask(task, event.target, status, tasks); }
          }),
          el('span', { text: task.label })
        ]);
      }));

      var isLast = state.section === lesson.sections.length - 1;
      var next = isLast ? null : el('button', {
        type: 'button', class: 'btn', text: 'Next: ' + lesson.sections[state.section + 1].title,
        onclick: function () { state.section += 1; renderCourse(); window.scrollTo(0, 0); }
      });

      app.replaceChildren(el('div', { class: lesson.id }, [
        el('header', { class: 'topbar' }, [
          el('span', { class: 'brand', text: 'Computing Foundations' }),
          el('span', { class: 'who', text: state.student.name + ', ' + state.student.className }),
          osSwitch,
          lessonTabs
        ]),
        el('div', { class: 'layout' }, [
          el('aside', { class: 'side' }, [
            el('div', {}, [
              el('strong', { id: 'count', text: doneCount + ' of ' + tasks.length + ' tasks' }),
              el('div', { class: 'meter' }, [
                el('div', { id: 'meter', style: 'width:' + Math.round(doneCount / tasks.length * 100) + '%' })
              ])
            ]),
            sectionList
          ]),
          el('main', { class: 'main' }, [
            el('div', { class: 'card' }, [
              el('span', { class: 'eyebrow', text: section.extension
                ? 'If you finish early'
                : 'Section ' + (state.section + 1) + ' of ' + lesson.sections.filter(function (item) { return !item.extension; }).length }),
              el('h2', { text: section.title }),
              renderContent(section),
              taskList,
              el('div', { class: 'foot' }, [status, next])
            ])
          ])
        ])
      ]));
    }

    function changeOs(os, status) {
      var previous = state.student.os;
      if (os === previous) return;
      status.className = 'status busy';
      status.textContent = 'Saving…';
      call('setOs', [os], function () {
        state.student.os = os;
        renderCourse();
      }, function () {
        state.student.os = previous;
        status.className = 'status bad';
        status.textContent = 'Your computer choice didn\'t save. Please try again.';
      });
    }

    /* A tick only stays ticked once the server confirms it. A failed save is undone and reported. */
    function saveTask(task, box, status, tasks) {
      var wanted = box.checked;
      state.saving[task.id] = true;
      box.disabled = true;
      status.className = 'status busy';
      status.textContent = 'Saving…';
      call('setTask', [task.id, wanted], function () {
        delete state.saving[task.id];
        if (wanted) state.progress[task.id] = true; else delete state.progress[task.id];
        box.disabled = false;
        renderCourse();
        var saved = document.getElementById(task.id);
        if (saved) saved.focus({ preventScroll: true });
        var fresh = document.querySelector('.foot .status');
        fresh.className = 'status ok';
        fresh.textContent = 'Saved';
      }, function () {
        delete state.saving[task.id];
        box.checked = !wanted;
        box.disabled = false;
        status.className = 'status bad';
        status.textContent = 'That didn\'t save, so your tick has been undone. Please try again.';
      });
    }

    start();
  })();
</script>
