<script>
  (function () {
    var state = { student: null, course: [], progress: {}, lesson: 0, section: 0, saving: {}, answers: {}, search: '', highlight: null };
    var app = document.getElementById('app');

    /* Builds an element. Text always goes in as text, never as HTML. */
    function el(tag, attrs, children) {
      var node = document.createElement(tag);
      Object.keys(attrs || {}).forEach(function (key) {
        if (key === 'text') node.textContent = attrs[key];
        else if (key.indexOf('on') === 0 && typeof attrs[key] === 'function') node.addEventListener(key.slice(2), attrs[key]);
        else if (key === 'class') node.className = attrs[key];
        else if (key === 'checked' || key === 'disabled') node[key] = attrs[key];
        else node.setAttribute(key, attrs[key]);
      });
      (children || []).forEach(function (child) { if (child) node.appendChild(child); });
      return node;
    }

    function call(name, args, onDone, onFail) {
      google.script.run
        .withSuccessHandler(onDone)
        .withFailureHandler(onFail)[name].apply(null, args);
    }

    function showMessage(title, lines) {
      app.replaceChildren(el('div', { class: 'message' }, [el('h1', { text: title })].concat(
        lines.map(function (line) { return el('p', { text: line }); })
      )));
    }

    function start() {
      call('getBootstrap', [], function (data) {
        if (data.status === 'no_identity') {
          showMessage('We can\'t tell who you are', [
            'Make sure you\'re signed in with your school Google account.',
            'If you\'re signed in to more than one Google account, sign out of the others and reload this page.'
          ]);
        } else if (data.status === 'needs_registration') {
          renderRegistration();
        } else if (data.status === 'blocked') {
          showMessage('You can\'t use this course', [
            'Your account has been removed from this course.',
            'If you think this is a mistake, talk to your teacher.'
          ]);
        } else {
          state.student = data.student;
          state.course = data.course;
          state.progress = data.progress;
          state.student.os ? renderCourse() : renderOsChoice();
        }
      }, function (error) {
        var lines = ['Reload the page. If that doesn\'t work, tell your teacher.'];
        if (error && error.message) lines.push('Details for your teacher: ' + error.message);
        showMessage('The course didn\'t load', lines);
      });
    }

    function renderRegistration() {
      var note = el('p', { class: 'status', role: 'status' });
      var name = el('input', { id: 'join-name', type: 'text', autocomplete: 'name', maxlength: '60', required: 'required' });
      var code = el('input', {
        id: 'join-code', type: 'text', autocomplete: 'off', autocapitalize: 'none', spellcheck: 'false',
        required: 'required', 'aria-describedby': 'code-hint'
      });
      var submit = el('button', { type: 'submit', class: 'btn', text: 'Join the course' });

      function problem(text) {
        note.className = 'status bad';
        note.textContent = text;
        submit.disabled = false;
      }

      function join(event) {
        event.preventDefault();
        submit.disabled = true;
        note.className = 'status busy';
        note.textContent = 'Joining…';
        call('registerStudent', [name.value, code.value], function (result) {
          if (result.status === 'wrong_code') problem('That class code didn\'t work. Check it with your teacher and try again.');
          else if (result.status === 'invalid_name') problem('Please enter your name using letters only.');
          else start();
        }, function () {
          problem('That didn\'t work. Please try again. If it keeps happening, tell your teacher.');
        });
      }

      app.replaceChildren(el('div', { class: 'home L1' }, [
        el('h1', { text: 'Join Computing Foundations' }),
        el('p', { text: 'You only need to do this once. After that, the course will recognise your school Google account.' }),
        el('form', { class: 'join', onsubmit: join }, [
          el('div', { class: 'field' }, [
            el('label', { for: 'join-name', text: 'Your first and last name' }),
            name
          ]),
          el('div', { class: 'field' }, [
            el('label', { for: 'join-code', text: 'Class code' }),
            el('span', { class: 'hint', id: 'code-hint', text: 'Your teacher will give you this.' }),
            code
          ]),
          el('div', {}, [submit]),
          note
        ])
      ]));
    }

    function renderOsChoice() {
      var note = el('p', { class: 'status', role: 'status' });
      function choose(os) {
        return function () {
          note.className = 'status busy';
          note.textContent = 'Saving…';
          call('setOs', [os], function () {
            state.student.os = os;
            renderCourse();
          }, function () {
            note.className = 'status bad';
            note.textContent = 'That didn\'t save. Please try again.';
          });
        };
      }
      app.replaceChildren(el('div', { class: 'home' }, [
        el('h1', { text: 'Welcome, ' + state.student.name }),
        el('p', { text: 'What computer are you using? You get steps that match it, and you can change this at any time.' }),
        el('div', { class: 'os-choice' }, [
          el('button', { type: 'button', text: 'Windows laptop', onclick: choose('win') }),
          el('button', { type: 'button', text: 'MacBook', onclick: choose('mac') })
        ]),
        note
      ]));
    }

    function lessonTasks(lesson) {
      var tasks = [];
      lesson.sections.forEach(function (section) {
        if (!section.extension) tasks = tasks.concat(section.tasks);
      });
      return tasks;
    }

    function isSectionDone(section) {
      return section.tasks.every(function (task) { return state.progress[task.id]; });
    }

    /* Lesson text can differ by computer: { win: '...', mac: '...' }. */
    function forOs(value) {
      if (value && typeof value === 'object' && !Array.isArray(value)) return value[state.student.os] || '';
      return value;
    }

    /* Turns **bold**, `code` and [[key]] into elements. Text always goes in as text. */
    function richText(tag, attrs, value) {
      var node = el(tag, attrs);
      var text = forOs(value);
      var pattern = /\*\*(.+?)\*\*|`(.+?)`|\[\[(.+?)\]\]/g;
      var last = 0;
      var match;
      while ((match = pattern.exec(text))) {
        node.appendChild(document.createTextNode(text.slice(last, match.index)));
        if (match[1]) node.appendChild(el('strong', { text: match[1] }));
        if (match[2]) node.appendChild(el('code', { text: match[2] }));
        if (match[3]) node.appendChild(el('kbd', { text: match[3] }));
        last = pattern.lastIndex;
      }
      node.appendChild(document.createTextNode(text.slice(last)));
      return node;
    }

    function renderContent(section) {
      if (!section.content) {
        return el('p', { class: 'placeholder', text: 'The lesson content for this section is still being written.' });
      }
      return el('div', { class: 'content' }, section.content.map(renderBlock));
    }

    function renderBlock(block) {
      if (block.only && block.only !== state.student.os) return null;
      if (block.type === 'objective') return richText('p', { class: 'objective' }, block.text);
      if (block.type === 'concept') return richText('p', { class: 'concept' }, block.text);
      if (block.type === 'tip') return richText('p', { class: 'tip' }, block.text);
      if (block.type === 'diagram') return renderDiagram(block);
      if (block.type === 'steps') return renderSteps(block);
      if (block.type === 'keys') return renderKeys(block);
      if (block.type === 'download') return renderDownload(block);
      if (block.type === 'choice') return renderChoice(block);
      if (block.type === 'match') return renderMatch(block);
      if (block.type === 'tree') return renderTree(block);
      // Code is shown exactly as written, with its spacing kept. No text marks.
      if (block.type === 'code') return el('pre', { class: 'codeblock' }, [el('code', { text: forOs(block.text) })]);
      if (block.type === 'tick') return currentCheckpoint ? currentCheckpoint(block.task) : null;
      return null;
    }

    /* Set by renderCourse for the section on screen, so lesson content can place tick boxes. */
    var currentCheckpoint = null;

    function tickMark() {
      var ns = 'http://www.w3.org/2000/svg';
      var svg = document.createElementNS(ns, 'svg');
      svg.setAttribute('viewBox', '0 0 24 24');
      svg.setAttribute('aria-hidden', 'true');
      var path = document.createElementNS(ns, 'path');
      path.setAttribute('d', 'M5 12.5l4.5 4.5L19 7.5');
      svg.appendChild(path);
      return svg;
    }

    /* One tick box, in the same style wherever it appears. */
    function checkpoint(task, tasks) {
      var done = !!state.progress[task.id];
      var note = el('span', { class: 'cp-status', id: 'status-' + task.id, role: 'status' });
      return el('div', { class: 'checkpoint' + (done ? ' done' : ''), id: 'cp-' + task.id }, [
        el('label', {}, [
          el('input', {
            type: 'checkbox', id: task.id, checked: done, disabled: !!state.saving[task.id],
            onchange: function (event) { saveTask(task, event.target, note, tasks); }
          }),
          el('span', { class: 'box' }, [tickMark()]),
          el('span', { class: 'cp-text' }, [
            el('span', { class: 'kicker', text: done ? 'Checkpoint · Done' : 'Checkpoint' }),
            el('span', { class: 'cp-label', text: task.label })
          ])
        ]),
        note
      ]);
    }

    /* Repeats every tick in the section, so none are missed. Each one jumps to its checkpoint. */
    function sectionChecklist(section) {
      return el('div', { class: 'checklist' }, [
        el('h3', { text: 'Section checklist' }),
        el('ul', {}, section.tasks.map(function (task) {
          var done = !!state.progress[task.id];
          return el('li', { class: done ? 'done' : '' }, [el('button', {
            type: 'button',
            onclick: function () {
              var target = document.getElementById('cp-' + task.id);
              if (!target) return;
              target.scrollIntoView({ block: 'center', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
              document.getElementById(task.id).focus({ preventScroll: true });
            }
          }, [el('span', { class: 'mini' }, [tickMark()]), el('span', { text: task.label }), done ? el('span', { class: 'sr-only', text: ' (done)' }) : null])]);
        })),
        el('p', { class: 'hint', text: 'Missed one? Click it to jump back to its checkpoint.' })
      ]);
    }

    /* Diagrams are fixed drawings from Diagrams.gs. They contain no student or browser input. */
    function renderDiagram(block) {
      var drawing = el('div', { class: 'diagram', role: 'img', 'aria-label': forOs(block.alt) });
      drawing.innerHTML = forOs(block.svg);
      return el('figure', { class: 'figure' }, [
        drawing,
        block.caption ? richText('figcaption', {}, block.caption) : null
      ]);
    }

    function renderSteps(block) {
      return el('div', { class: 'block' }, [
        el('h3', { text: block.title }),
        block.intro ? richText('p', {}, block.intro) : null,
        el('ol', { class: 'steps' }, block.steps.map(function (step) { return richText('li', {}, step); }))
      ]);
    }

    function renderKeys(block) {
      return el('div', { class: 'block' }, [
        el('h3', { text: block.title }),
        el('table', { class: 'keys' }, [el('tbody', {}, block.rows.map(function (row) {
          return el('tr', {}, [el('th', { scope: 'row', text: row[0] }), richText('td', {}, row[1])]);
        }))])
      ]);
    }

    /* Builds the file in the browser, so lessons need no hosting apart from this app. */
    function renderDownload(block) {
      var note = el('span', { class: 'status', role: 'status' });
      var button = el('button', { type: 'button', class: 'btn', text: block.label });
      button.addEventListener('click', function () {
        button.disabled = true;
        note.className = 'status busy';
        note.textContent = 'Getting your file…';
        call('getExerciseFile', [block.file], function (file) {
          var bytes = Uint8Array.from(atob(file.data), function (c) { return c.charCodeAt(0); });
          var url = URL.createObjectURL(new Blob([bytes], { type: file.mime }));
          var link = el('a', { href: url, download: file.name, target: '_self' });
          document.body.appendChild(link);
          link.click();
          link.remove();
          setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
          button.disabled = false;
          note.className = 'status ok';
          note.textContent = 'Check your Downloads folder.';
        }, function () {
          button.disabled = false;
          note.className = 'status bad';
          note.textContent = 'That didn\'t download. Please try again, or tell your teacher.';
        });
      });
      return el('div', { class: 'download' }, [button, note]);
    }

    function renderChoice(block) {
      var key = 'choice-' + block.id;
      var feedback = el('p', { class: 'feedback', role: 'status' });
      var buttons = [];
      function show(index) {
        buttons.forEach(function (button, i) {
          button.className = 'option' + (i === index ? (i === block.answer ? ' right' : ' wrong') : '');
          button.setAttribute('aria-pressed', i === index ? 'true' : 'false');
        });
        var right = index === block.answer;
        feedback.className = 'feedback ' + (right ? 'ok' : 'bad');
        var message = right ? 'Correct. ' + forOs(block.explain) : 'Not quite. Have another go.';
        feedback.replaceChildren.apply(feedback, Array.from(richText('span', {}, message).childNodes));
      }
      block.options.forEach(function (option, i) {
        buttons.push(richText('button', {
          type: 'button', class: 'option', 'aria-pressed': 'false',
          onclick: function () { state.answers[key] = i; show(i); }
        }, option));
      });
      if (state.answers[key] !== undefined) show(state.answers[key]);
      return el('div', { class: 'block activity' }, [
        richText('p', { class: 'question' }, block.question),
        el('div', { class: 'options' }, buttons),
        feedback
      ]);
    }

    function renderMatch(block) {
      var key = 'match-' + block.id;
      var chosen = state.answers[key] || (state.answers[key] = {});
      var feedback = el('p', { class: 'feedback', role: 'status' });
      var rows = [];

      function check() {
        var right = 0;
        rows.forEach(function (row, i) {
          var ok = row.select.value === block.items[i].answer;
          if (ok) right += 1;
          row.mark.textContent = row.select.value ? (ok ? '✓' : '✗') : '';
          row.mark.className = 'mark ' + (ok ? 'ok' : 'bad');
          row.mark.setAttribute('aria-label', row.select.value ? (ok ? 'Correct' : 'Try again') : '');
        });
        var all = right === rows.length;
        feedback.className = 'feedback ' + (all ? 'ok' : 'bad');
        feedback.textContent = all ? 'All correct. Well done.' : right + ' of ' + rows.length + ' correct. Change the ones marked ✗ and check again.';
      }

      var list = el('div', { class: 'match' }, block.items.map(function (item, i) {
        var id = key + '-' + i;
        var select = el('select', { id: id, onchange: function (event) { chosen[i] = event.target.value; } },
          [el('option', { value: '', text: 'Choose…' })].concat(block.choices.map(function (choice) {
            return el('option', { value: choice, text: choice });
          })));
        select.value = chosen[i] || '';
        var mark = el('span', { class: 'mark' });
        rows.push({ select: select, mark: mark });
        return el('div', { class: 'match-row' }, [richText('label', { for: id }, item.text), select, mark]);
      }));

      return el('div', { class: 'block activity' }, [
        richText('p', { class: 'question' }, block.prompt),
        list,
        el('div', {}, [el('button', { type: 'button', class: 'btn secondary', text: 'Check my answers', onclick: check })]),
        feedback
      ]);
    }

    function renderTree(block) {
      var key = 'tree-selected';
      var output = el('code', { class: 'path-out' });
      var buttons = [];
      function select(fullPath) {
        state.answers[key] = fullPath;
        var divider = forOs(block.divider);
        output.textContent = forOs(block.start) + fullPath.split('/').join(divider);
        buttons.forEach(function (item) {
          item.button.className = item.path === fullPath ? 'selected' : '';
        });
      }
      function branch(nodes, parent) {
        return el('ul', { class: 'tree' }, nodes.map(function (node) {
          var fullPath = parent ? parent + '/' + node.name : node.name;
          var button = el('button', {
            type: 'button', text: (node.children ? '📁 ' : '📄 ') + node.name,
            onclick: function () { select(fullPath); }
          });
          buttons.push({ button: button, path: fullPath });
          return el('li', {}, [button, node.children ? branch(node.children, fullPath) : null]);
        }));
      }
      var tree = branch(block.nodes, '');
      select(state.answers[key] || block.selected);
      return el('div', { class: 'block activity' }, [
        richText('p', { class: 'question' }, block.prompt),
        tree,
        el('div', { class: 'path-box', 'aria-live': 'polite' }, [el('span', { text: 'Path: ' }), output])
      ]);
    }

    /* Search runs in the browser over the course text already loaded. Answers and explanations
       are left out, so searching can't give away an activity. */
    function plain(value) {
      return String(forOs(value) || '').replace(/\*\*|`|\[\[|\]\]/g, '');
    }

    function sectionText(section) {
      var parts = [];
      (section.content || []).forEach(function (block) {
        if (block.only && block.only !== state.student.os) return;
        [block.text, block.title, block.intro, block.caption, block.prompt, block.question, block.label].forEach(function (value) {
          if (value) parts.push(plain(value));
        });
        (block.steps || []).forEach(function (step) { parts.push(plain(step)); });
        (block.rows || []).forEach(function (row) { parts.push(plain(row[0]) + ': ' + plain(row[1])); });
        (block.options || []).forEach(function (option) { parts.push(plain(option)); });
        (block.items || []).forEach(function (item) { parts.push(plain(item.text)); });
      });
      section.tasks.forEach(function (task) { parts.push(task.label); });
      return parts.filter(function (part) { return part; });
    }

    /* Words in the search, shortened so "paths" also finds "path". */
    function searchWords(query) {
      return query.toLowerCase().split(/[^a-z0-9.]+/).filter(function (word) { return word.length > 1; })
        .map(function (word) { return word.length > 3 ? word.replace(/(es|s)$/, '') : word; })
        .filter(function (word, i, all) { return all.indexOf(word) === i; });
    }

    function wordPattern(words) {
      // A word starting with a dot, such as .pdf, can follow a letter, as in scan0001.pdf.
      return new RegExp('(^|[^a-z0-9]|(?=\\.))(' + words.map(function (word) {
        return word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      }).join('|') + ')', 'gi');
    }

    function findSections(query) {
      var words = searchWords(query);
      if (!words.length) return [];
      var results = [];
      state.course.forEach(function (lesson, l) {
        lesson.sections.forEach(function (section, s) {
          var parts = sectionText(section);
          var all = (section.title + '\n' + parts.join('\n')).toLowerCase();
          var everyWord = words.every(function (word) { return wordPattern([word]).test(all); });
          if (!everyWord) return;
          var titleHits = section.title.toLowerCase().match(wordPattern(words)) || [];
          var hits = all.match(wordPattern(words)) || [];
          var first = parts.find(function (part) { return wordPattern(words).test(part.toLowerCase()); });
          results.push({ lesson: l, section: s, score: titleHits.length * 10 + hits.length, snippet: first || '' });
        });
      });
      return results.sort(function (a, b) { return b.score - a.score || a.lesson - b.lesson || a.section - b.section; });
    }

    /* Adds text to a node, wrapping the searched words in <mark>. Text always goes in as text. */
    function addMarked(node, text, words) {
      var pattern = wordPattern(words);
      var last = 0;
      var match;
      while ((match = pattern.exec(text))) {
        var start = match.index + match[1].length;
        node.appendChild(document.createTextNode(text.slice(last, start)));
        node.appendChild(el('mark', { text: text.slice(start, start + match[2].length) }));
        last = start + match[2].length;
      }
      node.appendChild(document.createTextNode(text.slice(last)));
      return node;
    }

    function snippet(text, words) {
      var match = wordPattern(words).exec(text.toLowerCase());
      var from = match ? Math.max(0, match.index - 50) : 0;
      if (from > 0) from = text.indexOf(' ', from) + 1 || from;
      var cut = text.slice(from, from + 160);
      if (from + 160 < text.length) cut = cut.replace(/[\s.,]+$/, '') + '…';
      return (from > 0 ? '…' : '') + cut;
    }

    function renderResults() {
      var query = state.search.trim();
      var words = searchWords(query);
      var results = findSections(query);
      var heading = results.length
        ? results.length + (results.length === 1 ? ' section matches' : ' sections match') + ' "' + query + '"'
        : words.length ? 'Nothing matches "' + query + '"' : 'Type a word to search';
      var list = el('ul', { class: 'results' }, results.map(function (result) {
        var lesson = state.course[result.lesson];
        var section = lesson.sections[result.section];
        return el('li', {}, [el('button', {
          type: 'button', class: 'result ' + lesson.id,
          onclick: function () { openResult(result, words); }
        }, [
          el('span', { class: 'eyebrow', text: (result.lesson + 1) + '. ' + lesson.tab + (section.extension ? ' · extra challenge' : '') }),
          addMarked(el('strong', {}), section.title, words),
          result.snippet ? addMarked(el('span', { class: 'result-text' }), snippet(result.snippet, words), words) : null
        ])]);
      }));
      return el('div', { class: 'card' }, [
        el('h2', { id: 'results-heading', text: heading, 'aria-live': 'polite' }),
        results.length ? list : (words.length ? el('p', { text: 'Try a shorter word, or check the spelling. Some lessons are still being written.' }) : null)
      ]);
    }

    function openResult(result, words) {
      state.lesson = result.lesson;
      state.section = result.section;
      state.search = '';
      state.highlight = words;
      renderCourse();
      var first = document.querySelector('.main mark');
      if (first) first.scrollIntoView({ block: 'center' }); else window.scrollTo(0, 0);
    }

    /* Marks the searched words in the section that was opened from a search. */
    function highlightIn(node, words) {
      var walker = document.createTreeWalker(node, NodeFilter.SHOW_TEXT);
      var found = [];
      while (walker.nextNode()) {
        var parent = walker.currentNode.parentNode;
        if (!parent.closest('svg, select, option, button')) found.push(walker.currentNode);
      }
      found.forEach(function (textNode) {
        if (!wordPattern(words).test(textNode.nodeValue.toLowerCase())) return;
        textNode.parentNode.replaceChild(addMarked(document.createDocumentFragment(), textNode.nodeValue, words), textNode);
      });
    }

    function renderCourse() {
      var lesson = state.course[state.lesson];
      var section = lesson.sections[state.section];
      var tasks = lessonTasks(lesson);
      var highlight = state.highlight;
      state.highlight = null;
      var doneCount = tasks.filter(function (task) { return state.progress[task.id]; }).length;
      var status = el('p', { class: 'status', role: 'status' });

      var osSwitch = el('div', { class: 'os-switch', role: 'group', 'aria-label': 'Choose your computer' },
        [['win', 'Windows'], ['mac', 'Mac']].map(function (pair) {
          return el('button', {
            type: 'button', text: pair[1],
            'aria-pressed': state.student.os === pair[0] ? 'true' : 'false',
            onclick: function () { changeOs(pair[0], status); }
          });
        }));

      var lessonTabs = el('nav', { class: 'lesson-tabs', 'aria-label': 'Lessons' },
        state.course.map(function (item, i) {
          var attrs = {
            type: 'button', class: 'lesson-tab ' + item.id, text: (i + 1) + '. ' + item.tab,
            onclick: function () { state.lesson = i; state.section = 0; state.search = ''; renderCourse(); }
          };
          if (i === state.lesson) attrs['aria-current'] = 'page';
          return el('button', attrs);
        }));

      // The section list, split into what everyone finishes and the optional extra challenges.
      var sectionItem = function (item, i) {
        var title = item.extension ? item.title.replace(/^Extra challenge:\s*/i, '') : item.title;
        var attrs = {
          type: 'button', text: title.charAt(0).toUpperCase() + title.slice(1), class: isSectionDone(item) ? 'done' : '',
          onclick: function () { state.section = i; state.search = ''; renderCourse(); }
        };
        if (i === state.section) attrs['aria-current'] = 'step';
        return el('li', {}, [el('button', attrs)]);
      };
      var coreItems = [], extraItems = [], coreDone = 0, coreTotal = 0;
      lesson.sections.forEach(function (item, i) {
        if (item.extension) { extraItems.push(sectionItem(item, i)); return; }
        coreItems.push(sectionItem(item, i));
        coreTotal += 1;
        if (isSectionDone(item)) coreDone += 1;
      });
      var sectionGroups = [el('div', { class: 'group core' }, [
        el('p', { class: 'group-head' }, [
          el('span', { text: 'Everyone finishes' }),
          el('span', { class: 'group-count', text: coreDone + ' of ' + coreTotal })
        ]),
        el('ol', { class: 'section-list' }, coreItems)
      ])];
      if (extraItems.length) {
        sectionGroups.push(el('div', { class: 'group extra' }, [
          el('p', { class: 'group-head' }, [el('span', { text: 'Extra challenges' })]),
          el('p', { class: 'group-note', text: 'Optional. Try these if you finish early, or in your own time.' }),
          el('ul', { class: 'section-list' }, extraItems)
        ]));
      }

      // Checkpoints: lesson content places tick boxes after their activities. Any task it
      // doesn't place goes at the bottom. When some are placed, a checklist repeats them all.
      var placed = {};
      (section.content || []).forEach(function (block) {
        if (block.type === 'tick' && (!block.only || block.only === state.student.os)) placed[block.task] = true;
      });
      currentCheckpoint = function (taskId) {
        var task = section.tasks.find(function (item) { return item.id === taskId; });
        return task ? checkpoint(task, tasks) : null;
      };
      var unplaced = section.tasks.filter(function (task) { return !placed[task.id]; });
      var sectionTicked = section.tasks.filter(function (task) { return state.progress[task.id]; }).length;
      var bottom = [];
      if (unplaced.length) bottom.push(el('div', { class: 'tasks' }, unplaced.map(function (task) { return checkpoint(task, tasks); })));
      if (unplaced.length < section.tasks.length) bottom.push(sectionChecklist(section));

      var isLast = state.section === lesson.sections.length - 1;
      var next = isLast ? null : el('button', {
        type: 'button', class: 'btn', text: 'Next: ' + lesson.sections[state.section + 1].title,
        onclick: function () { state.section += 1; state.search = ''; renderCourse(); window.scrollTo(0, 0); }
      });

      var sectionCard = el('div', { class: 'card' }, [
        el('div', { class: 'card-head' }, [
          el('span', { class: 'eyebrow', text: section.extension
            ? 'If you finish early'
            : 'Section ' + (state.section + 1) + ' of ' + coreTotal }),
          section.tasks.length > 1 ? el('span', {
            class: 'chip' + (sectionTicked === section.tasks.length ? ' all' : ''),
            text: sectionTicked === section.tasks.length ? 'All ' + sectionTicked + ' ticked' : sectionTicked + ' of ' + section.tasks.length + ' ticked'
          }) : null
        ]),
        el('h2', { text: section.title }),
        renderContent(section)
      ].concat(bottom).concat([el('div', { class: 'foot' }, [status, next])]));
      var main = el('main', { class: 'main', id: 'search-results' });
      var layout = el('div', { class: 'layout' });

      /* Typing only redraws the results, so the search box keeps its place. On a narrow
         screen the section list is hidden while searching, so the results are in view. */
      function showMain() {
        var searching = !!state.search.trim();
        main.replaceChildren(searching ? renderResults() : sectionCard);
        layout.classList.toggle('searching', searching);
      }
      var searchBox = el('input', {
        type: 'search', id: 'search', value: state.search, placeholder: 'Search the course',
        autocomplete: 'off', 'aria-label': 'Search the course', 'aria-controls': 'search-results',
        oninput: function (event) {
          state.search = event.target.value;
          showMain();
        },
        onkeydown: function (event) {
          if (event.key === 'Escape' && state.search) {
            event.preventDefault();
            event.target.value = state.search = '';
            showMain();
          }
        }
      });
      var search = el('form', {
        class: 'search', role: 'search',
        onsubmit: function (event) {
          event.preventDefault();
          var results = findSections(state.search.trim());
          if (results.length) openResult(results[0], searchWords(state.search.trim()));
        }
      }, [searchBox]);

      app.replaceChildren(el('div', { class: lesson.id }, [
        el('header', { class: 'topbar' }, [
          el('span', { class: 'brand', text: 'Computing Foundations' }),
          el('span', { class: 'who', text: state.student.name + ', ' + state.student.className }),
          search,
          osSwitch,
          lessonTabs
        ]),
        layout
      ]));
      layout.replaceChildren(
        el('aside', { class: 'side' }, [
          el('div', {}, [
            el('strong', { id: 'count', text: doneCount + ' of ' + tasks.length + ' tasks' }),
            el('div', { class: 'meter' }, [
              el('div', { id: 'meter', style: 'width:' + Math.round(doneCount / tasks.length * 100) + '%' })
            ])
          ])
        ].concat(sectionGroups)),
        main
      );
      showMain();
      if (highlight) highlightIn(sectionCard.querySelector('.content') || sectionCard, highlight);
    }

    function changeOs(os, status) {
      var previous = state.student.os;
      if (os === previous) return;
      status.className = 'status busy';
      status.textContent = 'Saving…';
      call('setOs', [os], function () {
        state.student.os = os;
        renderCourse();
      }, function () {
        state.student.os = previous;
        status.className = 'status bad';
        status.textContent = 'Your computer choice didn\'t save. Please try again.';
      });
    }

    /* A tick only stays ticked once the server confirms it. A failed save is undone and reported. */
    function saveTask(task, box, status, tasks) {
      var wanted = box.checked;
      state.saving[task.id] = true;
      box.disabled = true;
      // The message appears on the checkpoint itself, next to the tick box.
      status.className = 'cp-status busy';
      status.textContent = 'Saving…';
      call('setTask', [task.id, wanted], function () {
        delete state.saving[task.id];
        if (wanted) state.progress[task.id] = true; else delete state.progress[task.id];
        box.disabled = false;
        renderCourse();
        var saved = document.getElementById(task.id);
        if (saved) saved.focus({ preventScroll: true });
        var card = document.getElementById('cp-' + task.id);
        if (card && wanted) card.classList.add('pop');
        var fresh = document.getElementById('status-' + task.id);
        if (fresh) {
          fresh.className = 'cp-status ok';
          fresh.textContent = 'Saved';
        }
      }, function () {
        delete state.saving[task.id];
        box.checked = !wanted;
        box.disabled = false;
        status.className = 'cp-status bad';
        status.textContent = 'That didn\'t save, so your tick has been undone. Please try again.';
      });
    }

    start();
  })();
</script>
