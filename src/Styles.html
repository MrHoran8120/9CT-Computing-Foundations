<style>
  :root {
    --bg: #eef2f8; --surface: #ffffff; --sunk: #f6f8fc; --ink: #16213a; --muted: #55617a; --line: #d5dce9;
    --l1: #1f5fd6; --l2: #b4540a; --l3: #0a7d6c; --l4: #a8327a; --l5: #6b3fc4; --on: #ffffff;
    --ok: #157a3f; --bad: #b3261e;
    --display: "Bricolage Grotesque", "Trebuchet MS", sans-serif;
    --body: "Atkinson Hyperlegible", "Segoe UI", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f141d; --surface: #182130; --sunk: #121926; --ink: #e8edf6; --muted: #a3afc5; --line: #2e3a4f;
      --l1: #86aeff; --l2: #f2a764; --l3: #55d3bf; --l4: #f08cc8; --l5: #b9a0ff; --on: #0c1320;
      --ok: #5fd08f; --bad: #ff8f86;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.55 var(--body); }
  h1, h2, h3 { font-family: var(--display); font-weight: 800; line-height: 1.15; margin: 0; }
  p { margin: 0; max-width: 68ch; }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--l1); outline-offset: 2px; border-radius: 4px; }
  .L1 { --acc: var(--l1); } .L2 { --acc: var(--l2); } .L3 { --acc: var(--l3); } .L4 { --acc: var(--l4); } .L5 { --acc: var(--l5); }
  .L1, .L2, .L3, .L4, .L5 { --soft: color-mix(in srgb, var(--acc) 13%, var(--surface)); --ok-soft: color-mix(in srgb, var(--ok) 14%, var(--surface)); }

  .message { padding: 32px 16px; max-width: 60ch; margin: 0 auto; display: grid; gap: 10px; }

  .topbar { background: var(--surface); padding: 10px 16px 0; border-bottom: 3px solid var(--acc); display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
  .brand { font: 800 1.05rem var(--display); }
  .who { font-size: .85rem; color: var(--muted); }
  .os-switch { margin-left: auto; display: inline-flex; border: 1.5px solid var(--acc); border-radius: 7px; overflow: hidden; }
  .os-switch button { border: 0; background: transparent; color: var(--acc); padding: 3px 13px; font-size: .87rem; font-weight: 700; }
  .os-switch button[aria-pressed="true"] { background: var(--acc); color: var(--on); }
  .search { margin-left: auto; flex: 0 1 260px; min-width: 150px; }
  .search input { font: inherit; font-size: .9rem; color: inherit; background: var(--sunk); border: 1.5px solid var(--line); border-radius: 7px; padding: 4px 10px; width: 100%; }
  .search input:focus { border-color: var(--acc); background: var(--surface); }
  .search + .os-switch { margin-left: 0; }
  mark { background: color-mix(in srgb, #f5c400 45%, var(--surface)); color: inherit; border-radius: 3px; padding: 0 1px; }
  .results { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .result { width: 100%; text-align: left; background: var(--surface); border: 1.5px solid var(--line); border-left: 5px solid var(--acc); border-radius: 7px; padding: 10px 13px; display: grid; gap: 3px; }
  .result:hover { border-color: var(--acc); }
  .result-text { color: var(--muted); font-size: .92rem; overflow-wrap: anywhere; }
  .lesson-tabs { flex-basis: 100%; display: flex; gap: 3px; overflow-x: auto; }
  .lesson-tab { flex: none; border: 0; padding: 6px 14px; border-radius: 7px 7px 0 0; background: var(--sunk); color: var(--muted); font-weight: 700; font-size: .9rem; }
  .lesson-tab[aria-current="page"] { background: var(--acc); color: var(--on); }
  .lesson-tab.locked { cursor: not-allowed; opacity: .6; background: transparent; border: 1.5px dashed var(--line); border-bottom: 0; display: inline-flex; gap: 6px; align-items: baseline; }
  .opens-later { font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }

  .layout { display: grid; grid-template-columns: 240px minmax(0, 1fr); max-width: 1280px; margin: 0 auto; }
  .side { padding: 16px 12px; display: grid; gap: 12px; align-content: start; font-size: .9rem; }
  .meter { height: 9px; background: var(--line); border-radius: 9px; overflow: hidden; margin-top: 5px; }
  .meter div { height: 100%; background: var(--acc); transition: width .2s; }
  .section-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
  .section-list button { width: 100%; text-align: left; background: none; border: 0; border-radius: 5px; padding: 5px 8px; color: var(--muted); display: flex; gap: 7px; align-items: baseline; }
  .section-list button::before { content: ""; flex: none; width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--muted); }
  .section-list button.done::before { background: var(--ok); border-color: var(--ok); }
  .section-list button[aria-current="step"] { background: var(--soft); color: var(--ink); font-weight: 700; }

  .main { padding: 20px 16px 48px; display: grid; gap: 18px; align-content: start; min-width: 0; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px; display: grid; gap: 16px; }
  .eyebrow { font-size: .76rem; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--acc); }
  .placeholder { background: var(--soft); border-radius: 8px; padding: 13px 15px; }
  .tasks { display: grid; gap: 10px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .card-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; }
  .chip { font-size: .85rem; font-weight: 700; color: var(--muted); background: var(--sunk); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; font-variant-numeric: tabular-nums; }
  .chip.all { color: var(--ok); border-color: var(--ok); background: var(--ok-soft); }

  /* A checkpoint: the one look for every tick box in the course. */
  .checkpoint { display: grid; gap: 4px; }
  .checkpoint label { display: flex; gap: 14px; align-items: center; padding: 12px 16px; border: 2px dashed var(--ok); border-radius: 12px; background: var(--surface); cursor: pointer; transition: background .2s; }
  .checkpoint label:hover { background: var(--ok-soft); }
  .checkpoint input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .checkpoint .box { flex: none; width: 34px; height: 34px; border-radius: 9px; border: 2.5px solid var(--ok); background: var(--surface); display: grid; place-items: center; }
  .checkpoint .box svg { width: 24px; height: 24px; fill: none; stroke: var(--on); stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 24; stroke-dashoffset: 24; }
  .checkpoint .cp-text { display: grid; gap: 1px; }
  .checkpoint .kicker { font-size: .74rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ok); }
  .checkpoint .cp-label { font-weight: 700; }
  .checkpoint input:focus-visible + .box { outline: 3px solid var(--acc); outline-offset: 3px; }
  .checkpoint input:disabled + .box { opacity: .6; }
  .checkpoint.done label { border-style: solid; background: var(--ok-soft); }
  .checkpoint.done .box { background: var(--ok); }
  .checkpoint.done .box svg { stroke-dashoffset: 0; }
  .cp-status { font-size: .85rem; font-weight: 700; min-height: 1.2em; padding-left: 4px; }
  .cp-status:empty { min-height: 0; }
  .cp-status.ok { color: var(--ok); } .cp-status.bad { color: var(--bad); } .cp-status.busy { color: var(--muted); }
  .checkpoint.pop .box svg { stroke-dashoffset: 24; animation: draw .3s ease-out .05s forwards; }
  .checkpoint.pop .box { animation: pop .35s ease-out; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes pop { 0% { transform: scale(1); } 45% { transform: scale(1.25); } 100% { transform: scale(1); } }

  .checklist { border-top: 1px solid var(--line); padding-top: 14px; display: grid; gap: 8px; }
  .checklist h3 { font-size: 1rem; }
  .checklist ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
  .checklist button { display: flex; gap: 10px; align-items: center; width: 100%; text-align: left; background: none; border: 0; padding: 4px 6px; border-radius: 6px; }
  .checklist button:hover { background: var(--sunk); }
  .checklist .mini { flex: none; width: 20px; height: 20px; border-radius: 6px; border: 2px solid var(--ok); display: grid; place-items: center; }
  .checklist .mini svg { width: 14px; height: 14px; fill: none; stroke: var(--on); stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; visibility: hidden; }
  .checklist li.done .mini { background: var(--ok); }
  .checklist li.done .mini svg { visibility: visible; }
  .checklist li.done button { color: var(--muted); }

  /* The section list: what everyone finishes, then the optional extras. */
  .group { display: grid; gap: 6px; border-radius: 10px; padding: 10px 8px 10px 10px; }
  .group.core { background: var(--surface); border: 1.5px solid var(--acc); }
  .group.extra { border: 1.5px dashed var(--line); }
  .group-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin: 0; max-width: none; font-size: .74rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--acc); }
  .group.extra .group-head { color: var(--muted); }
  .group-count { letter-spacing: 0; text-transform: none; font-variant-numeric: tabular-nums; }
  .group-note { font-size: .85rem; color: var(--muted); }
  .group.extra .section-list button::before { border-radius: 2px; transform: rotate(45deg) scale(.9); }
  .task { display: flex; gap: 10px; align-items: flex-start; padding: 9px 12px; border: 1px solid var(--line); border-radius: 7px; cursor: pointer; }
  .task:has(input:checked) { background: color-mix(in srgb, var(--ok) 10%, var(--surface)); border-color: var(--ok); }
  .task input { width: 18px; height: 18px; margin: 2px 0 0; accent-color: var(--ok); flex: none; }
  .foot { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; border-top: 1px solid var(--line); padding-top: 13px; }
  .status { font-size: .9rem; font-weight: 700; min-height: 1.4em; }
  .status.ok { color: var(--ok); } .status.bad { color: var(--bad); } .status.busy { color: var(--muted); }
  .btn { border: 0; background: var(--acc); color: var(--on); font-weight: 700; padding: 8px 16px; border-radius: 7px; }
  .btn:disabled { opacity: .5; cursor: default; }

  .home { max-width: 1280px; margin: 0 auto; padding: 22px 16px 48px; display: grid; gap: 20px; }
  .os-choice { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; max-width: 420px; }
  .os-choice button { border: 2px solid var(--line); background: var(--surface); border-radius: 9px; padding: 14px; font-weight: 700; }
  .os-choice button:hover { border-color: var(--l1); }

  .content { display: grid; gap: 18px; }
  .block { display: grid; gap: 10px; }
  .block h3 { font-size: 1.1rem; }
  .objective { color: var(--muted); font-weight: 700; }
  .concept { background: var(--soft); border-left: 5px solid var(--acc); border-radius: 6px; padding: 13px 15px; max-width: none; }
  .tip { background: var(--sunk); border: 1px solid var(--line); border-radius: 6px; padding: 10px 13px; font-size: .95rem; max-width: none; }
  .tip::before { content: "Tip: "; font-weight: 700; }
  code { font-family: Consolas, Menlo, monospace; font-size: .92em; background: var(--sunk); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; overflow-wrap: anywhere; }
  kbd { font-family: inherit; font-size: .85em; font-weight: 700; background: var(--surface); border: 1px solid var(--muted); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; white-space: nowrap; }
  .codeblock { margin: 0; background: var(--sunk); border: 1px solid var(--line); border-left: 4px solid var(--acc); border-radius: 6px; padding: 10px 14px; overflow-x: auto; max-width: 72ch; }
  .codeblock code { background: none; border: 0; padding: 0; font-size: .95rem; line-height: 1.5; white-space: pre; overflow-wrap: normal; }
  .steps { margin: 0; padding-left: 26px; display: grid; gap: 7px; max-width: 72ch; }
  .steps li::marker { color: var(--acc); font-weight: 700; }
  .keys { border-collapse: collapse; width: 100%; font-size: .95rem; }
  .keys th, .keys td { border-bottom: 1px solid var(--line); padding: 7px 10px 7px 0; text-align: left; vertical-align: top; }
  .keys th { width: 80px; }
  .figure { margin: 0; display: grid; gap: 7px; }
  .figure figcaption { font-size: .9rem; color: var(--muted); }
  .diagram { background: var(--sunk); border: 1px solid var(--line); border-radius: 8px; padding: 8px; max-width: 660px; }
  .diagram svg { display: block; width: 100%; height: auto; }
  .diagram text { font: 14px var(--body); }
  .d-text { fill: var(--ink); }
  .d-muted { fill: var(--muted); }
  .d-heading { fill: var(--ink); font-weight: 700 !important; }
  .d-panel { fill: var(--surface); stroke: var(--line); }
  .d-sunk { fill: var(--surface); stroke: var(--line); }
  .d-accent-soft { fill: var(--soft); stroke: var(--acc); }
  .d-accent { fill: var(--acc); }
  .d-on-accent { fill: var(--on); font-weight: 700 !important; }
  .d-arrow { stroke: var(--acc); stroke-width: 2.5; }
  .d-arrowhead { fill: var(--acc); }
  .d-divider { stroke: var(--line); }
  .d-tick { fill: none; stroke: var(--acc); stroke-width: 2.5; }
  .d-folder { fill: #e8b23a; stroke: #a87c14; }
  .d-file { fill: var(--surface); stroke: var(--muted); stroke-width: 1.5; }
  .download { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .activity { border: 1.5px solid var(--acc); border-radius: 8px; padding: 14px; }
  .question { font-weight: 700; max-width: none; }
  .options { display: grid; gap: 7px; }
  .option { text-align: left; background: var(--surface); border: 1.5px solid var(--line); border-radius: 7px; padding: 8px 12px; overflow-wrap: anywhere; }
  .option:hover { border-color: var(--acc); }
  .option.right { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 12%, var(--surface)); }
  .option.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 10%, var(--surface)); }
  .feedback { font-weight: 700; min-height: 1.4em; max-width: none; }
  .feedback.ok, .mark.ok { color: var(--ok); }
  .feedback.bad, .mark.bad { color: var(--bad); }
  .match { display: grid; gap: 6px; }
  .match-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(130px, 190px) 22px; gap: 10px; align-items: center; }
  .match-row select { font: inherit; color: inherit; background: var(--surface); border: 1.5px solid var(--muted); border-radius: 6px; padding: 5px; width: 100%; }
  .mark { font-weight: 700; }
  .btn.secondary { background: transparent; color: var(--acc); border: 1.5px solid var(--acc); }
  .tree { list-style: none; margin: 0; padding-left: 20px; display: grid; gap: 3px; }
  .block > .tree { padding-left: 0; }
  .tree button { background: none; border: 1px solid transparent; border-radius: 5px; padding: 2px 7px; text-align: left; }
  .tree button:hover { border-color: var(--acc); }
  .tree button.selected { background: var(--soft); border-color: var(--acc); font-weight: 700; }
  .path-box { background: var(--sunk); border-radius: 6px; padding: 9px 12px; font-weight: 700; }
  .path-out { background: none; border: 0; padding: 0; font-weight: 400; }

  .join { display: grid; gap: 16px; max-width: 420px; }
  .field { display: grid; gap: 4px; }
  .field label { font-weight: 700; }
  .hint { font-size: .9rem; color: var(--muted); }
  .field input { font: inherit; color: inherit; background: var(--surface); border: 1.5px solid var(--muted); border-radius: 7px; padding: 8px 10px; width: 100%; }

  @media (max-width: 900px) {
    .layout { grid-template-columns: 180px minmax(0, 1fr); }
  }
  @media (max-width: 600px) {
    .layout { grid-template-columns: minmax(0, 1fr); }
    .side { padding-bottom: 0; }
    .searching .side { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } .checkpoint.pop .box svg { stroke-dashoffset: 0; } }
</style>
