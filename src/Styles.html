<style>
  :root {
    --bg: #eef2f8; --surface: #ffffff; --sunk: #f6f8fc; --ink: #16213a; --muted: #55617a; --line: #d5dce9;
    --l1: #1f5fd6; --l2: #b4540a; --l3: #0a7d6c; --on: #ffffff;
    --ok: #157a3f; --bad: #b3261e;
    --display: "Bricolage Grotesque", "Trebuchet MS", sans-serif;
    --body: "Atkinson Hyperlegible", "Segoe UI", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f141d; --surface: #182130; --sunk: #121926; --ink: #e8edf6; --muted: #a3afc5; --line: #2e3a4f;
      --l1: #86aeff; --l2: #f2a764; --l3: #55d3bf; --on: #0c1320;
      --ok: #5fd08f; --bad: #ff8f86;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.55 var(--body); }
  h1, h2, h3 { font-family: var(--display); font-weight: 800; line-height: 1.15; margin: 0; }
  p { margin: 0; max-width: 68ch; }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--l1); outline-offset: 2px; border-radius: 4px; }
  .L1 { --acc: var(--l1); } .L2 { --acc: var(--l2); } .L3 { --acc: var(--l3); }
  .L1, .L2, .L3 { --soft: color-mix(in srgb, var(--acc) 13%, var(--surface)); }

  .message { padding: 32px 16px; max-width: 60ch; margin: 0 auto; display: grid; gap: 10px; }

  .topbar { background: var(--surface); padding: 10px 16px 0; border-bottom: 3px solid var(--acc); display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
  .brand { font: 800 1.05rem var(--display); }
  .who { font-size: .85rem; color: var(--muted); }
  .os-switch { margin-left: auto; display: inline-flex; border: 1.5px solid var(--acc); border-radius: 7px; overflow: hidden; }
  .os-switch button { border: 0; background: transparent; color: var(--acc); padding: 3px 13px; font-size: .87rem; font-weight: 700; }
  .os-switch button[aria-pressed="true"] { background: var(--acc); color: var(--on); }
  .lesson-tabs { flex-basis: 100%; display: flex; gap: 3px; overflow-x: auto; }
  .lesson-tab { flex: none; border: 0; padding: 6px 14px; border-radius: 7px 7px 0 0; background: var(--sunk); color: var(--muted); font-weight: 700; font-size: .9rem; }
  .lesson-tab[aria-current="page"] { background: var(--acc); color: var(--on); }

  .layout { display: grid; grid-template-columns: 220px minmax(0, 1fr); max-width: 1100px; margin: 0 auto; }
  .side { padding: 16px 12px; display: grid; gap: 12px; align-content: start; font-size: .9rem; }
  .meter { height: 9px; background: var(--line); border-radius: 9px; overflow: hidden; margin-top: 5px; }
  .meter div { height: 100%; background: var(--acc); transition: width .2s; }
  .section-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
  .section-list button { width: 100%; text-align: left; background: none; border: 0; border-radius: 5px; padding: 5px 8px; color: var(--muted); display: flex; gap: 7px; align-items: baseline; }
  .section-list button::before { content: ""; flex: none; width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--muted); }
  .section-list button.done::before { background: var(--ok); border-color: var(--ok); }
  .section-list button[aria-current="step"] { background: var(--soft); color: var(--ink); font-weight: 700; }

  .main { padding: 20px 16px 48px; display: grid; gap: 18px; align-content: start; min-width: 0; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px; display: grid; gap: 16px; }
  .eyebrow { font-size: .76rem; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--acc); }
  .placeholder { background: var(--soft); border-radius: 8px; padding: 13px 15px; }
  .tasks { display: grid; gap: 7px; }
  .task { display: flex; gap: 10px; align-items: flex-start; padding: 9px 12px; border: 1px solid var(--line); border-radius: 7px; cursor: pointer; }
  .task:has(input:checked) { background: color-mix(in srgb, var(--ok) 10%, var(--surface)); border-color: var(--ok); }
  .task input { width: 18px; height: 18px; margin: 2px 0 0; accent-color: var(--ok); flex: none; }
  .foot { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; border-top: 1px solid var(--line); padding-top: 13px; }
  .status { font-size: .9rem; font-weight: 700; min-height: 1.4em; }
  .status.ok { color: var(--ok); } .status.bad { color: var(--bad); } .status.busy { color: var(--muted); }
  .btn { border: 0; background: var(--acc); color: var(--on); font-weight: 700; padding: 8px 16px; border-radius: 7px; }
  .btn:disabled { opacity: .5; cursor: default; }

  .home { max-width: 1100px; margin: 0 auto; padding: 22px 16px 48px; display: grid; gap: 20px; }
  .os-choice { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; max-width: 420px; }
  .os-choice button { border: 2px solid var(--line); background: var(--surface); border-radius: 9px; padding: 14px; font-weight: 700; }
  .os-choice button:hover { border-color: var(--l1); }

  @media (max-width: 760px) {
    .layout { grid-template-columns: minmax(0, 1fr); }
    .side { padding-bottom: 0; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
